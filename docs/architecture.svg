<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="720" viewBox="0 0 1120 720" role="img" aria-labelledby="title desc">
  <title id="title">Offline-first Homelab architecture</title>
  <desc id="desc">Local clients connect through the home LAN to a Mac mini application host, which has an observed CIFS mount to a Pi-based NAS. Pi-hole and remote access paths are historically documented. Jellyfin use during internet outages is owner-reported; other offline behavior is not established.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#456277" stroke-width="1.3"/></marker>
    <style>
      text { font-family: Arial, sans-serif; fill: #163247; }
      .heading { font-size: 29px; font-weight: 700; }
      .label { font-size: 19px; font-weight: 700; }
      .body { font-size: 16px; }
      .note { font-size: 14px; fill: #476173; }
      .wire { fill: none; stroke: #456277; stroke-width: 2; }
      .historical { stroke-dasharray: 7 6; }
    </style>
  </defs>
  <rect width="1120" height="720" fill="#f6f8fa"/>
  <text x="40" y="49" class="heading">Offline-first Homelab</text>
  <text x="40" y="77" class="body">October 27, 2026 host inventory · older node notes · November 2 owner clarification</text>

  <rect x="28" y="102" width="792" height="475" rx="18" fill="#eaf2f5" stroke="#bccfd9"/>
  <text x="48" y="132" class="label">Local environment</text>

  <rect x="50" y="158" width="270" height="88" rx="12" fill="#ffffff" stroke="#8aa5b6"/>
  <text x="70" y="188" class="label">Local clients</text>
  <text x="70" y="216" class="body">Phone · TV · notebook</text>

  <rect x="50" y="291" width="270" height="78" rx="12" fill="#ffffff" stroke="#8aa5b6"/>
  <text x="70" y="322" class="label">Home LAN / router</text>
  <text x="70" y="348" class="note">Current DNS path unverified</text>

  <rect x="50" y="432" width="270" height="112" rx="12" fill="#ffffff" stroke="#8aa5b6" stroke-dasharray="7 6"/>
  <text x="70" y="463" class="label">Pi Zero 2 W · Pi-hole</text>
  <text x="70" y="491" class="body">Documented DNS role</text>
  <text x="70" y="517" class="note">No fresh device inventory</text>

  <rect x="395" y="158" width="400" height="211" rx="12" fill="#ffffff" stroke="#267a82" stroke-width="2"/>
  <text x="418" y="190" class="label">Mac mini M1 · application host</text>
  <text x="418" y="219" class="body">Fedora Asahi · Docker Compose</text>
  <path d="M418 236 H772" stroke="#d0dfe4"/>
  <text x="418" y="263" class="body">Jellyfin · Immich · Nextcloud</text>
  <text x="418" y="291" class="body">Arr stack · Glance · LibreChat</text>
  <text x="418" y="337" class="note">6 projects / 23 containers in October inventory</text>

  <rect x="395" y="432" width="400" height="112" rx="12" fill="#ffffff" stroke="#8aa5b6"/>
  <text x="418" y="463" class="label">Pi-based NAS · shared storage</text>
  <text x="418" y="491" class="body">OpenMediaVault / mergerfs documented</text>
  <text x="418" y="517" class="note">458G share observed; older pool size differs</text>

  <path d="M185 246 V291" class="wire"/>
  <path d="M320 330 H395" class="wire"/>
  <path d="M185 369 V432" class="wire historical"/>
  <path d="M595 369 V432" class="wire" marker-end="url(#arrow)"/>
  <rect x="605" y="389" width="164" height="24" fill="#eaf2f5"/>
  <text x="613" y="407" class="note">Observed CIFS mount</text>

  <rect x="846" y="102" width="247" height="475" rx="18" fill="#f4eee5" stroke="#d6c9b4"/>
  <text x="865" y="132" class="label">External dependencies</text>
  <text x="865" y="164" class="body">Internet connection</text>
  <text x="865" y="208" class="label">Remote access</text>
  <text x="865" y="239" class="body">Tailscale · private</text>
  <text x="865" y="267" class="body">Cloudflare Tunnel</text>
  <text x="865" y="293" class="note">Historical access paths</text>
  <path d="M846 318 H795" class="wire historical" marker-end="url(#arrow)"/>
  <text x="865" y="368" class="label">Other integrations</text>
  <text x="865" y="399" class="body">VPN / downloads</text>
  <text x="865" y="427" class="body">Metadata / providers</text>
  <text x="865" y="476" class="note">Offline outcomes and</text>
  <text x="865" y="498" class="note">current access controls</text>
  <text x="865" y="520" class="note">are not established.</text>

  <rect x="28" y="597" width="1065" height="78" rx="12" fill="#e5f1e9" stroke="#9dbcaa"/>
  <text x="48" y="626" class="label">Reported outage experience: Jellyfin on phone, TV, and notebook</text>
  <text x="48" y="653" class="body">Exact dates, duration, login, playback mode, and restart conditions were not recorded.</text>
  <text x="40" y="702" class="note">Solid: local relationships. Dashed: documented / unverified paths. This is not a firewall or availability guarantee.</text>
</svg>
